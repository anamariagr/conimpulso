upstream nexuslab-app {
    server app:9000;
}

# HTTP Server - Redirect to HTTPS in production
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSL headers (uncomment in production with certs)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Index files
    index index.php index.html;

    #charset utf-8;

    # Laravel API routes
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel WebSocket routes (Reverb) - only active when reverb profile is enabled
    # location /ws {
    #     proxy_pass http://reverb:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 86400;
    # }

    # Health check
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Frontend React ( Cliente)
    location / {
        root /var/www/html/frontend-client/dist;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Admin Vue (en subdirectorio)
    location /admin {
        root /var/www/html/frontend-admin/dist;
        try_files $uri $uri/ /admin/index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Static assets - Laravel
    location /storage {
        alias /var/www/html/storage/app/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # Block sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # PHP processing - Laravel
    location ~ \.php$ {
        limit_req zone=api_limit burst=10 nodelay;

        fastcgi_pass nexuslab-app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_param SERVER_NAME $host;
        fastcgi_param APP_ENV local;
    }

    # Deny access to version control files
    location ~ /\.git {
        deny all;
    }
}