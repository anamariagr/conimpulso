version: '3.8'

services:
  # Backend PHP Application
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: nexuslab-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - PHP_OPCACHE_ENABLE=1
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_MAX_FILESIZE=100M
      - PHP_POST_MAX_SIZE=110M
    networks:
      - nexuslab-network
    depends_on:
      - mysql
      - redis

  # NGINX Web Server
  nginx:
    image: nginx:alpine
    container_name: nexuslab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    networks:
      - nexuslab-network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nexuslab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexuslab}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-nexuslab_secret}
      MYSQL_USER: ${DB_USERNAME:-nexuslab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nexuslab_secret}
    ports:
      - "3306:3306"
    volumes:
      - nexuslab-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - nexuslab-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: nexuslab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - nexuslab-redis-data:/data
    networks:
      - nexuslab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Horizon (Queue Monitor) - Optional, solo en producción
  horizon:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: nexuslab-horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=512M
    networks:
      - nexuslab-network
    depends_on:
      - redis
      - mysql
    profiles:
      - horizon

  # Laravel Reverb (WebSockets)
  reverb:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: nexuslab-reverb
    restart: unless-stopped
    command: php artisan reverb:start
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:8080"
    networks:
      - nexuslab-network
    depends_on:
      - redis
    profiles:
      - reverb

  # WhatsApp Gateway (self-hosted, whatsmeow-based via WAHA's GOWS engine)
  whatsapp:
    image: devlikeapro/waha
    container_name: nexuslab-whatsapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/whatsapp/sessions:/app/.sessions
    environment:
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      - WAHA_API_KEY=${WHATSAPP_GATEWAY_API_KEY:-changeme}
    networks:
      - nexuslab-network

  # MailHog (Development Mail Server)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexuslab-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - nexuslab-network
    profiles:
      - mail

  # phpMyAdmin (Development DB Admin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nexuslab-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-nexuslab_secret}
      PMA_PORT: 3306
    networks:
      - nexuslab-network
    depends_on:
      - mysql
    profiles:
      - devtools

networks:
  nexuslab-network:
    driver: bridge

volumes:
  nexuslab-mysql-data:
    driver: local
  nexuslab-redis-data:
    driver: local